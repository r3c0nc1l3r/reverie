name: release-please

# On each push to main, release-please keeps one open release PR up to date.
# Merging that PR bumps the version, updates CHANGELOG.md, tags vX.Y.Z,
# and creates the GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
