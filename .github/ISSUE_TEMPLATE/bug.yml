name: Bug
description: Reverie did the wrong thing.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What reverie did, and what you expected.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Spec, command, and target app. Attach the run id or trail.jsonl lines if you have them.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `reverie --version`
